components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: gymtracker_refresh
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      example: '"profile:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1024 }
  headers:
    ProfileETag:
      schema: { type: string }
      example: '"profile:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    ExerciseETag:
      schema: { type: string }
      example: '"exercise:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    ProgramETag:
      schema: { type: string }
      example: '"program:018f4ea8-89af-47d7-b7e3-43d94f83292e:7"'
    WorkoutETag:
      description: Strong validator for the workout aggregate containing the selected root, exercise, or set.
      schema: { type: string }
      example: '"workout:018f4ea8-89af-47d7-b7e3-43d94f83292e:9"'
    MeasurementETag:
      schema: { type: string }
      example: '"measurement:018f4ea8-89af-47d7-b7e3-43d94f83292e:2"'
    ReportETag:
      schema: { type: string }
      example: '"report:018f4ea8-89af-47d7-b7e3-43d94f83292e:1"'
  responses:
    Problem:
      description: Problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    AuthData:
      type: object
      additionalProperties: false
      required: [user_id, email, access_token, access_expires_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        meta:
          $ref: "#/components/schemas/Meta"
    Profile:
      type: object
      additionalProperties: false
      required:
        - user_id
        - name
        - sex
        - birth_date
        - height_cm
        - goal
        - experience_level
        - training_frequency
        - timezone
        - unit_system
        - sleep_hours_average
        - notes
        - version
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          type: [number, "null"]
          minimum: 50
          maximum: 300
        goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
        experience_level:
          oneOf:
            - $ref: "#/components/schemas/ExperienceLevel"
            - type: "null"
        training_frequency:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        timezone:
          type: string
          minLength: 1
          maxLength: 255
          example: Europe/Moscow
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
        sleep_hours_average:
          type: [number, "null"]
          minimum: 0
          maximum: 24
        notes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          type: [number, "null"]
          minimum: 50
          maximum: 300
        goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
        experience_level:
          oneOf:
            - $ref: "#/components/schemas/ExperienceLevel"
            - type: "null"
        training_frequency:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        timezone:
          type: string
          minLength: 1
          maxLength: 255
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
    ProfileImport:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sex:
          $ref: "#/components/schemas/Sex"
        height_cm:
          type: number
          minimum: 50
          maximum: 300
        weight_kg:
          type: number
          minimum: 20
          maximum: 700
        goal:
          $ref: "#/components/schemas/Goal"
        training_frequency:
          type: integer
          minimum: 1
          maximum: 7
        experience_level:
          $ref: "#/components/schemas/ExperienceLevel"
        sleep_hours_average:
          type: number
          minimum: 0
          maximum: 24
        measurements:
          $ref: "#/components/schemas/ImportedMeasurements"
        notes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
    ImportedMeasurements:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        chest_cm: { type: number, minimum: 5, maximum: 400 }
        waist_cm: { type: number, minimum: 5, maximum: 400 }
        hips_cm: { type: number, minimum: 5, maximum: 400 }
        neck_cm: { type: number, minimum: 5, maximum: 200 }
        biceps_cm: { type: number, minimum: 5, maximum: 200 }
    ImportData:
      type: object
      additionalProperties: false
      required: [profile, initial_measurement_id]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        initial_measurement_id:
          type: [string, "null"]
          format: uuid
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        meta:
          $ref: "#/components/schemas/Meta"
    ImportEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
