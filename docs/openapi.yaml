openapi: 3.1.0
info:
  title: GymTracker AI API
  version: 0.5.0
  description: Implemented backend contract through deterministic measurement, progress, and weekly reports. All instants are UTC RFC 3339 values ending in Z.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created; refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: The same invalid_credentials problem is used for an unknown email and a wrong password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      description: Rotates the refresh cookie and returns a new access token. Requires an allowed Origin or Referer.
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Token pair rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Revokes the current refresh-token family and clears the cookie.
      security:
        - bearerAuth: []
          refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /profile:
    get:
      tags: [user]
      operationId: getOwnProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's profile.
          headers:
            ETag:
              $ref: "#/components/headers/ProfileETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [user]
      operationId: updateOwnProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated profile.
          headers:
            ETag:
              $ref: "#/components/headers/ProfileETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /profile/import:
    post:
      tags: [user]
      operationId: importOwnProfile
      description: Strict, transactional import. Creates one initial body measurement when measurement data is present.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImport"
            example:
              name: Руслан
              sex: male
              height_cm: 170
              weight_kg: 66.7
              goal: recomposition
              training_frequency: 4
              experience_level: intermediate
              sleep_hours_average: 8
              measurements:
                chest_cm: 100
                waist_cm: 77
                hips_cm: 89
                neck_cm: 38
                biceps_cm: 36
              notes:
                - Цель — набор мышц с сохранением эстетичной формы
                - Рабочие подходы выполняются близко к отказу
      responses:
        "200":
          description: Imported profile and optional initial measurement identifier.
          headers:
            ETag:
              $ref: "#/components/headers/ProfileETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportEnvelope"
        "400":
          description: Malformed JSON, unsupported field, or trailing JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /exercises:
    get:
      tags: [exercise]
      operationId: listExercises
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, system, mine], default: all } }
        - { name: muscle_group, in: query, schema: { $ref: "#/components/schemas/MuscleGroup" } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ExerciseType" } }
        - { name: equipment, in: query, schema: { $ref: "#/components/schemas/Equipment" } }
        - { name: tracks_weight, in: query, schema: { type: boolean } }
        - { name: tracks_repetitions, in: query, schema: { type: boolean } }
        - { name: tracks_time, in: query, schema: { type: boolean } }
        - { name: tracks_distance, in: query, schema: { type: boolean } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Visible system exercises and the authenticated user's own custom exercises, ordered by normalized name and UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseCollectionEnvelope"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [exercise]
      operationId: createExercise
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseCreate"
      responses:
        "201":
          description: Custom exercise created.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ExerciseETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [exercise]
      operationId: getExercise
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Visible system or owned custom exercise. Archived owned exercises remain directly readable.
          headers:
            ETag: { $ref: "#/components/headers/ExerciseETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [exercise]
      operationId: updateExercise
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExercisePatch"
      responses:
        "200":
          description: Owned custom exercise updated.
          headers:
            ETag: { $ref: "#/components/headers/ExerciseETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "403":
          description: System exercises are immutable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [exercise]
      operationId: archiveExercise
      description: Archives an owned custom exercise. Referencing program/workout history is retained.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Exercise archived.
        "403":
          description: System exercises are immutable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /programs:
    get:
      tags: [program]
      operationId: listPrograms
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProgramStatus" } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Owned program summaries ordered by last update and UUID descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramCollectionEnvelope"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [program]
      operationId: createProgram
      description: Creates a draft program and its optional ordered tree transactionally.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramCreate"
      responses:
        "201":
          description: Draft program created.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /programs/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [program]
      operationId: getProgram
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full owned program aggregate, including ordered days and exercises.
          headers:
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [program]
      operationId: updateProgram
      description: Strict partial root update. If days is present, it atomically replaces the active ordered tree and archives the previous tree.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramPatch"
      responses:
        "200":
          description: Program aggregate updated; root version incremented once.
          headers:
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [program]
      operationId: archiveProgram
      description: Archives the program root without deleting its current or previous tree rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Program archived.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /programs/{id}/duplicate:
    post:
      tags: [program]
      operationId: duplicateProgram
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDuplicate"
      responses:
        "201":
          description: Independent draft copy created with fresh program/day/item UUIDs.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /programs/{id}/activate:
    post:
      tags: [program]
      operationId: activateProgram
      description: Atomically deactivates any currently active owned program and activates this one. The request body must be empty.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Target program activated. At most one program remains active.
          headers:
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /workouts:
    get:
      tags: [workout]
      operationId: listWorkouts
      description: Returns owned workout summaries ordered by event_at and UUID descending.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WorkoutStatus" }
        - name: from
          in: query
          description: Inclusive event_at lower bound.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive event_at upper bound.
          schema: { type: string, format: date-time }
        - name: program_id
          in: query
          schema: { type: string, format: uuid }
        - name: exercise_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Filtered workout summaries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutCollectionEnvelope" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [workout]
      operationId: createWorkout
      description: Starts an in-progress workout by default or creates an explicit planned workout. Durable Idempotency-Key replay is not advertised.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutCreate" }
      responses:
        "201":
          description: Workout created with its authorized program/exercise snapshots when applicable.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/WorkoutETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutEnvelope" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          description: Another workout is already in progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /workouts/active:
    get:
      tags: [workout]
      operationId: getActiveWorkout
      description: Returns the sole owned in-progress workout, or null data when none exists.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active workout lookup completed. ETag is present only when data is non-null.
          headers:
            ETag: { $ref: "#/components/headers/WorkoutETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveWorkoutEnvelope" }
        "401":
          $ref: "#/components/responses/Problem"
  /workouts/export.csv:
    get:
      tags: [workout]
      operationId: exportWorkoutsCSV
      description: Exports filtered owned workout data as bounded RFC 4180 CSV in chronological order. This response does not use the JSON success envelope.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WorkoutStatus" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: program_id
          in: query
          schema: { type: string, format: uuid }
        - name: exercise_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: UTF-8 CSV using the stable column order documented in api-contract.md; one row per set with empty set columns retained for matching workouts/exercises without sets.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="gymtracker-workouts-20260802T120000Z.csv"
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-ID:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /workouts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [workout]
      operationId: getWorkout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full owned workout aggregate with ordered exercises and sets.
          headers:
            ETag: { $ref: "#/components/headers/WorkoutETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutEnvelope" }
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [workout]
      operationId: updateWorkout
      description: Strict partial edit. Completed workouts are directly correctable; status completion still uses the complete operation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutPatch" }
      responses:
        "200":
          description: Workout updated and root version incremented once.
          headers:
            ETag: { $ref: "#/components/headers/WorkoutETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutEnvelope" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [workout]
      operationId: deleteWorkout
      description: Physically deletes an owned workout in any status and cascades its children. Future projection/report modules must join this transaction once implemented.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Workout deleted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /workouts/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [workout]
      operationId: completeWorkout
      description: Transitions an in-progress workout to completed. Empty workouts are valid. Every call requires a syntactically valid same-root workout If-Match; the initial transition requires the current version, while the already-completed no-write branch deliberately accepts any version for that same root and returns the current unchanged aggregate without repeating derived effects.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutComplete" }
      responses:
        "200":
          description: Newly or previously completed unchanged workout.
          headers:
            ETag: { $ref: "#/components/headers/WorkoutETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutEnvelope" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /workouts/{id}/exercises:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [workout]
      operationId: addWorkoutExercise
      description: Adds a visible non-archived exercise and increments the containing workout version once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutExerciseCreate" }
      responses:
        "201":
          description: Workout exercise created. ETag is the new containing-workout validator.
          headers:
            Location: { schema: { type: string } }
