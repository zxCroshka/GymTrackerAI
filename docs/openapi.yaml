      security:
        - bearerAuth: []
      responses:
        "200":
          description: Previous-result lookup completed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviousWorkoutExerciseResultEnvelope" }
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /workout-exercises/{id}/sets:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      tags: [workout]
      operationId: addWorkoutSet
      description: Adds a performed set after checking actual metrics against the anchor exercise's snapshotted tracking capabilities.
      security:
