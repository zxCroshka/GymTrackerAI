          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: gymtracker_refresh
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      example: '"profile:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1024 }
  headers:
    ProfileETag:
      schema: { type: string }
      example: '"profile:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    ExerciseETag:
      schema: { type: string }
      example: '"exercise:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    ProgramETag:
      schema: { type: string }
      example: '"program:018f4ea8-89af-47d7-b7e3-43d94f83292e:7"'
    WorkoutETag:
      description: Strong validator for the workout aggregate containing the selected root, exercise, or set.
      schema: { type: string }
      example: '"workout:018f4ea8-89af-47d7-b7e3-43d94f83292e:9"'
  responses:
    Problem:
      description: Problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    AuthData:
      type: object
      additionalProperties: false
      required: [user_id, email, access_token, access_expires_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        meta:
          $ref: "#/components/schemas/Meta"
    Profile:
      type: object
      additionalProperties: false
      required:
        - user_id
        - name
        - sex
        - birth_date
        - height_cm
        - goal
        - experience_level
        - training_frequency
        - timezone
        - unit_system
        - sleep_hours_average
        - notes
        - version
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          type: [number, "null"]
          minimum: 50
          maximum: 300
        goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
        experience_level:
          oneOf:
            - $ref: "#/components/schemas/ExperienceLevel"
            - type: "null"
        training_frequency:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        timezone:
          type: string
          minLength: 1
          maxLength: 255
          example: Europe/Moscow
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
        sleep_hours_average:
          type: [number, "null"]
          minimum: 0
          maximum: 24
        notes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          type: [number, "null"]
          minimum: 50
          maximum: 300
        goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
        experience_level:
          oneOf:
            - $ref: "#/components/schemas/ExperienceLevel"
            - type: "null"
        training_frequency:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        timezone:
          type: string
          minLength: 1
          maxLength: 255
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
    ProfileImport:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sex:
          $ref: "#/components/schemas/Sex"
        height_cm:
          type: number
          minimum: 50
          maximum: 300
        weight_kg:
          type: number
          minimum: 20
          maximum: 700
        goal:
          $ref: "#/components/schemas/Goal"
        training_frequency:
          type: integer
          minimum: 1
          maximum: 7
        experience_level:
          $ref: "#/components/schemas/ExperienceLevel"
        sleep_hours_average:
          type: number
          minimum: 0
          maximum: 24
        measurements:
          $ref: "#/components/schemas/ImportedMeasurements"
        notes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
    ImportedMeasurements:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        chest_cm: { type: number, minimum: 5, maximum: 400 }
        waist_cm: { type: number, minimum: 5, maximum: 400 }
        hips_cm: { type: number, minimum: 5, maximum: 400 }
        neck_cm: { type: number, minimum: 5, maximum: 200 }
        biceps_cm: { type: number, minimum: 5, maximum: 200 }
    ImportData:
      type: object
      additionalProperties: false
      required: [profile, initial_measurement_id]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        initial_measurement_id:
          type: [string, "null"]
          format: uuid
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        meta:
          $ref: "#/components/schemas/Meta"
    ImportEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ImportData"
        meta:
          $ref: "#/components/schemas/Meta"
    Exercise:
      type: object
      additionalProperties: false
      required:
        - id
        - owner_user_id
        - name
        - description
        - instructions
        - primary_muscle_group
        - exercise_type
        - equipment
        - movement_pattern
        - is_unilateral
        - tracks_weight
        - tracks_repetitions
        - tracks_time
        - tracks_distance
        - version
        - archived_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: [string, "null"], format: uuid, description: Null identifies a system exercise. }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        instructions: { type: [string, "null"], minLength: 1, maxLength: 8000 }
        primary_muscle_group:
          oneOf:
            - $ref: "#/components/schemas/MuscleGroup"
            - type: "null"
        exercise_type: { $ref: "#/components/schemas/ExerciseType" }
        equipment:
          oneOf:
            - $ref: "#/components/schemas/Equipment"
            - type: "null"
        movement_pattern: { type: [string, "null"], minLength: 1, maxLength: 100 }
        is_unilateral: { type: boolean }
        tracks_weight: { type: boolean }
        tracks_repetitions: { type: boolean }
        tracks_time: { type: boolean }
        tracks_distance: { type: boolean }
        version: { type: integer, minimum: 1 }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExerciseCreate:
      type: object
      additionalProperties: false
      required: [name, exercise_type, equipment]
      anyOf:
        - required: [tracks_weight]
          properties: { tracks_weight: { const: true } }
        - required: [tracks_repetitions]
          properties: { tracks_repetitions: { const: true } }
        - required: [tracks_time]
          properties: { tracks_time: { const: true } }
        - required: [tracks_distance]
          properties: { tracks_distance: { const: true } }
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        instructions: { type: [string, "null"], minLength: 1, maxLength: 8000 }
        primary_muscle_group:
          oneOf:
            - $ref: "#/components/schemas/MuscleGroup"
            - type: "null"
        exercise_type: { $ref: "#/components/schemas/ExerciseType" }
        equipment: { $ref: "#/components/schemas/Equipment" }
        movement_pattern: { type: [string, "null"], minLength: 1, maxLength: 100 }
        is_unilateral: { type: boolean, default: false }
        tracks_weight: { type: boolean, default: false }
        tracks_repetitions: { type: boolean, default: false }
        tracks_time: { type: boolean, default: false }
        tracks_distance: { type: boolean, default: false }
    ExercisePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        instructions: { type: [string, "null"], minLength: 1, maxLength: 8000 }
        primary_muscle_group:
          oneOf:
            - $ref: "#/components/schemas/MuscleGroup"
            - type: "null"
        exercise_type: { $ref: "#/components/schemas/ExerciseType" }
        equipment: { $ref: "#/components/schemas/Equipment" }
        movement_pattern: { type: [string, "null"], minLength: 1, maxLength: 100 }
        is_unilateral: { type: boolean }
        tracks_weight: { type: boolean }
        tracks_repetitions: { type: boolean }
        tracks_time: { type: boolean }
        tracks_distance: { type: boolean }
    ExerciseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Exercise" }
        meta: { $ref: "#/components/schemas/Meta" }
    ExerciseCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Exercise" }
        meta: { $ref: "#/components/schemas/CollectionMeta" }
    Program:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - goal
        - status
        - version
        - activated_at
        - inactivated_at
        - archived_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        goal: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        status: { $ref: "#/components/schemas/ProgramStatus" }
        version: { type: integer, minimum: 1 }
        activated_at: { type: [string, "null"], format: date-time }
        inactivated_at: { type: [string, "null"], format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        days:
          type: array
          maxItems: 14
          items: { $ref: "#/components/schemas/ProgramDay" }
          description: Present on aggregate responses and omitted from list summaries.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProgramDay:
      type: object
      additionalProperties: false
      required: [id, position, name, notes, exercises, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 14 }
        name: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        exercises:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ProgramDayExercise" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProgramDayExercise:
      type: object
      additionalProperties: false
      required:
        - id
        - exercise_id
        - position
        - working_sets
        - target_reps_min
        - target_reps_max
        - target_rir
        - rest_seconds
        - notes
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        exercise_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 50 }
        working_sets: { type: integer, minimum: 1, maximum: 100 }
        target_reps_min: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        target_reps_max: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        target_rir: { type: [number, "null"], minimum: 0, maximum: 10, multipleOf: 0.1 }
        rest_seconds: { type: [integer, "null"], minimum: 0, maximum: 86400 }
        notes: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProgramCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        goal: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        days:
          type: array
          maxItems: 14
          default: []
          items: { $ref: "#/components/schemas/ProgramDayInput" }
    ProgramPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        goal: { type: [string, "null"], minLength: 1, maxLength: 2000 }
        days:
          type: array
          maxItems: 14
          items: { $ref: "#/components/schemas/ProgramDayInput" }
    ProgramDayInput:
      type: object
      additionalProperties: false
      required: [position, name]
      properties:
        position: { type: integer, minimum: 1, maximum: 14 }
        name: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        exercises:
          type: array
          maxItems: 50
          default: []
          items: { $ref: "#/components/schemas/ProgramDayExerciseInput" }
    ProgramDayExerciseInput:
      type: object
      additionalProperties: false
      required: [exercise_id, position, working_sets]
      properties:
        exercise_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 50 }
        working_sets: { type: integer, minimum: 1, maximum: 100 }
        target_reps_min: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        target_reps_max: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        target_rir: { type: [number, "null"], minimum: 0, maximum: 10, multipleOf: 0.1 }
        rest_seconds: { type: [integer, "null"], minimum: 0, maximum: 86400 }
        notes: { type: [string, "null"], minLength: 1, maxLength: 4000 }
    ProgramDuplicate:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
    ProgramEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Program" }
        meta: { $ref: "#/components/schemas/Meta" }
    ProgramCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Program" }
        meta: { $ref: "#/components/schemas/CollectionMeta" }
    Workout:
      type: object
      additionalProperties: false
      required:
        - id
        - source_program_id
        - source_program_day_id
        - source_program_version
        - name
        - status
        - event_at
        - scheduled_at
        - started_at
        - completed_at
        - cancelled_at
        - difficulty
        - energy
        - mood
        - comment
        - has_pain
        - discomfort
        - exercise_count
        - set_count
        - working_set_count
        - volume_kg
        - best_estimated_1rm_kg
        - calculation_version
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        source_program_id: { type: [string, "null"], format: uuid, description: Derived through the source program day. }
        source_program_day_id: { type: [string, "null"], format: uuid }
        source_program_version: { type: [integer, "null"], minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/WorkoutStatus" }
        event_at:
          type: string
          format: date-time
          description: started_at, otherwise scheduled_at, otherwise created_at; used for list filters and ordering.
        scheduled_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 10 }
        energy: { type: [integer, "null"], minimum: 1, maximum: 10 }
        mood: { type: [integer, "null"], minimum: 1, maximum: 10 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        has_pain: { type: [boolean, "null"], description: Null means the question was not recorded for legacy history. }
        discomfort: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        exercise_count: { type: integer, minimum: 0, maximum: 50 }
        set_count: { type: integer, minimum: 0 }
        working_set_count:
          type: integer
          minimum: 0
          description: Number of performed non-warmup sets.
        volume_kg:
          type: number
          minimum: 0
          description: Sum of weight_kg multiplied by reps for performed non-warmup sets.
        best_estimated_1rm_kg: { type: [number, "null"], minimum: 0 }
        calculation_version: { type: string, minLength: 1, maxLength: 100 }
        version: { type: integer, minimum: 1 }
        exercises:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/WorkoutExercise" }
          description: Present on aggregate/active/mutation responses and omitted from list summaries.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkoutExercise:
      type: object
      additionalProperties: false
      required:
        - id
        - workout_id
        - exercise_id
        - source_program_day_exercise_id
        - position
        - exercise_name_snapshot
        - rest_seconds
        - comment
        - tracks_weight
        - tracks_repetitions
        - tracks_time
        - tracks_distance
        - volume_kg
        - best_estimated_1rm_kg
        - sets
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        workout_id: { type: string, format: uuid }
        exercise_id: { type: string, format: uuid }
        source_program_day_exercise_id: { type: [string, "null"], format: uuid }
        position: { type: integer, minimum: 1, maximum: 50 }
        exercise_name_snapshot: { type: string, minLength: 1, maxLength: 200 }
        rest_seconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 86400
          readOnly: true
          description: Immutable prescription snapshot; null for ad-hoc or no-rest-target items.
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        tracks_weight: { type: boolean }
        tracks_repetitions: { type: boolean }
        tracks_time: { type: boolean }
        tracks_distance: { type: boolean }
        volume_kg: { type: number, minimum: 0 }
        best_estimated_1rm_kg: { type: [number, "null"], minimum: 0 }
        sets:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WorkoutSet" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkoutSet:
      type: object
      additionalProperties: false
      required:
        - id
        - workout_exercise_id
        - set_number
        - status
        - target_weight_kg
        - target_reps_min
        - target_reps_max
        - target_rir
        - weight_kg
        - reps
        - rir
        - warmup
        - failure
        - duration_seconds
        - distance_meters
        - note
        - performed_at
        - volume_kg
        - estimated_1rm_kg
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        workout_exercise_id: { type: string, format: uuid }
        set_number: { type: integer, minimum: 1, maximum: 100 }
        status:
          readOnly: true
          allOf:
            - $ref: "#/components/schemas/WorkoutSetStatus"
          description: Server-derived lifecycle; clients do not write this field directly.
        target_weight_kg: { type: [number, "null"], minimum: 0 }
        target_reps_min: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        target_reps_max: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        target_rir: { type: [number, "null"], minimum: 0, maximum: 10, multipleOf: 0.1 }
        weight_kg: { type: [number, "null"], minimum: 0 }
        reps: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        rir: { type: [number, "null"], minimum: 0, maximum: 10, multipleOf: 0.1 }
        warmup: { type: boolean, description: True when the internal set type is warmup. }
        failure: { type: boolean, description: True when the internal set type is failure. }
        duration_seconds: { type: [integer, "null"], minimum: 0, maximum: 86400 }
        distance_meters: { type: [number, "null"], minimum: 0 }
        note: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        performed_at: { type: [string, "null"], format: date-time }
        volume_kg:
          type: [number, "null"]
          minimum: 0
          description: Null for warmup sets or when weight/repetitions are unavailable.
        estimated_1rm_kg:
          type: [number, "null"]
          minimum: 0
          description: Epley estimate only for non-warmup positive-weight sets of 1 through 15 repetitions.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkoutCreate:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [status]
            properties:
              status: { const: planned }
          then:
            properties:
              started_at: { type: "null" }
      oneOf:
        - required: [program_day_id]
          properties:
            program_day_id: { type: string, format: uuid }
            name: { type: "null" }
        - required: [name]
          properties:
            program_day_id: { type: "null" }
            name: { type: string, minLength: 1, maxLength: 200 }
      properties:
        program_day_id: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        status:
          type: string
          enum: [planned, in_progress]
          default: in_progress
        scheduled_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 10 }
        energy: { type: [integer, "null"], minimum: 1, maximum: 10 }
        mood: { type: [integer, "null"], minimum: 1, maximum: 10 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        has_pain: { type: [boolean, "null"] }
        discomfort: { type: [string, "null"], minLength: 1, maxLength: 4000 }
    WorkoutPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [in_progress, cancelled] }
        scheduled_at: { type: [string, "null"], format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 10 }
        energy: { type: [integer, "null"], minimum: 1, maximum: 10 }
        mood: { type: [integer, "null"], minimum: 1, maximum: 10 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        has_pain: { type: [boolean, "null"] }
        discomfort: { type: [string, "null"], minLength: 1, maxLength: 4000 }
    WorkoutComplete:
      type: object
      additionalProperties: false
      properties:
        completed_at: { type: string, format: date-time }
        difficulty: { type: [integer, "null"], minimum: 1, maximum: 10 }
        energy: { type: [integer, "null"], minimum: 1, maximum: 10 }
        mood: { type: [integer, "null"], minimum: 1, maximum: 10 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        has_pain: { type: [boolean, "null"] }
        discomfort: { type: [string, "null"], minLength: 1, maxLength: 4000 }
    WorkoutExerciseCreate:
      type: object
      additionalProperties: false
      required: [exercise_id]
      properties:
        exercise_id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 50 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
    WorkoutExercisePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        position: { type: integer, minimum: 1, maximum: 50 }
        comment: { type: [string, "null"], minLength: 1, maxLength: 4000 }
    WorkoutSetCreate:
      type: object
      additionalProperties: false
      anyOf:
        - required: [weight_kg]
        - required: [reps]
        - required: [duration_seconds]
        - required: [distance_meters]
      not:
        required: [warmup, failure]
        properties:
          warmup: { const: true }
          failure: { const: true }
      properties:
        set_number: { type: integer, minimum: 1, maximum: 100 }
        weight_kg: { type: number, minimum: 0 }
        reps: { type: integer, minimum: 0, maximum: 32767 }
        rir: { type: [number, "null"], minimum: 0, maximum: 10, multipleOf: 0.1 }
        warmup: { type: boolean, default: false, description: Maps true to the internal warmup set type. }
        failure: { type: boolean, default: false, description: Maps true to the internal failure set type. }
        duration_seconds: { type: integer, minimum: 0, maximum: 86400 }
        distance_meters: { type: number, minimum: 0 }
        note: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        performed_at: { type: string, format: date-time }
    WorkoutSetPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      not:
        required: [warmup, failure]
        properties:
          warmup: { const: true }
          failure: { const: true }
      properties:
        set_number: { type: integer, minimum: 1, maximum: 100 }
        weight_kg: { type: [number, "null"], minimum: 0 }
        reps: { type: [integer, "null"], minimum: 0, maximum: 32767 }
        rir: { type: [number, "null"], minimum: 0, maximum: 10, multipleOf: 0.1 }
        warmup: { type: boolean, description: Maps true to the internal warmup set type. }
        failure: { type: boolean, description: Maps true to the internal failure set type. }
        duration_seconds: { type: [integer, "null"], minimum: 0, maximum: 86400 }
        distance_meters: { type: [number, "null"], minimum: 0 }
        note: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        performed_at: { type: string, format: date-time }
    PreviousWorkoutExerciseResult:
      type: object
      additionalProperties: false
      required:
        - exercise_id
        - exercise_name
        - source_workout_id
        - source_workout_exercise_id
        - workout_name
        - started_at
        - completed_at
        - sets
      properties:
        exercise_id: { type: string, format: uuid }
        exercise_name: { type: string, minLength: 1, maxLength: 200 }
        source_workout_id: { type: string, format: uuid }
        source_workout_exercise_id: { type: string, format: uuid }
        workout_name: { type: string, minLength: 1, maxLength: 200 }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        sets:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/WorkoutSet" }
    WorkoutEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/Workout" }
        meta: { $ref: "#/components/schemas/Meta" }
    ActiveWorkoutEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/Workout"
            - type: "null"
        meta: { $ref: "#/components/schemas/Meta" }
    WorkoutCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Workout" }
        meta: { $ref: "#/components/schemas/CollectionMeta" }
    WorkoutExerciseEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/WorkoutExercise" }
        meta: { $ref: "#/components/schemas/Meta" }
    WorkoutSetEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/WorkoutSet" }
        meta: { $ref: "#/components/schemas/Meta" }
    PreviousWorkoutExerciseResultEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/PreviousWorkoutExerciseResult"
            - type: "null"
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
