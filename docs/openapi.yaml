        "415":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [workout]
      operationId: deleteWorkoutSet
      description: Removes the set and compacts sibling set numbers. Cancelled workout trees are immutable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Set deleted. ETag is the new containing-workout validator.
          headers:
            ETag: { $ref: "#/components/headers/WorkoutETag" }
        "400":
          $ref: "#/components/responses/Problem"
