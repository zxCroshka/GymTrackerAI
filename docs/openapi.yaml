    CollectionMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string }
        next_cursor: { type: [string, "null"] }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        request_id: { type: string }
    Goal:
      type: string
      enum: [muscle_gain, weight_loss, recomposition, strength, maintenance]
    ExperienceLevel:
      type: string
      enum: [beginner, intermediate, advanced]
    Sex:
      type: string
      enum: [male, female, other, prefer_not_to_say]
    UnitSystem:
      type: string
      enum: [metric, imperial]
    ExerciseType:
      type: string
      enum: [strength, cardio, stretching, bodyweight, isometric]
    Equipment:
      type: string
      enum: [barbell, dumbbell, machine, cable, pullup_bar, parallel_bars, bodyweight, other]
    MuscleGroup:
      type: string
      enum: [chest, back, quadriceps, hamstrings, glutes, posterior_chain, shoulders, biceps, triceps, calves, core, full_body, cardio, other]
    ProgramStatus:
      type: string
      enum: [draft, active, inactive, archived]
    WorkoutStatus:
      type: string
      enum: [planned, in_progress, completed, cancelled]
    WorkoutSetStatus:
      type: string
      enum: [planned, completed, skipped]
