openapi: 3.1.0
info:
  title: GymTracker AI API
  version: 0.3.0
  description: Implemented auth, user-profile, exercise catalogue, and training-program contract. All instants are UTC RFC 3339 values.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User created; refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          description: The same invalid_credentials problem is used for an unknown email and a wrong password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      description: Rotates the refresh cookie and returns a new access token. Requires an allowed Origin or Referer.
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Token pair rotated.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      description: Revokes the current refresh-token family and clears the cookie.
      security:
        - bearerAuth: []
          refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
      responses:
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /profile:
    get:
      tags: [user]
      operationId: getOwnProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's profile.
          headers:
            ETag:
              $ref: "#/components/headers/ProfileETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [user]
      operationId: updateOwnProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Updated profile.
          headers:
            ETag:
              $ref: "#/components/headers/ProfileETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /profile/import:
    post:
      tags: [user]
      operationId: importOwnProfile
      description: Strict, transactional import. Creates one initial body measurement when measurement data is present.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImport"
            example:
              name: Руслан
              sex: male
              height_cm: 170
              weight_kg: 66.7
              goal: recomposition
              training_frequency: 4
              experience_level: intermediate
              sleep_hours_average: 8
              measurements:
                chest_cm: 100
                waist_cm: 77
                hips_cm: 89
                neck_cm: 38
                biceps_cm: 36
              notes:
                - Цель — набор мышц с сохранением эстетичной формы
                - Рабочие подходы выполняются близко к отказу
      responses:
        "200":
          description: Imported profile and optional initial measurement identifier.
          headers:
            ETag:
              $ref: "#/components/headers/ProfileETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportEnvelope"
        "400":
          description: Malformed JSON, unsupported field, or trailing JSON.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /exercises:
    get:
      tags: [exercise]
      operationId: listExercises
      security:
        - bearerAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, system, mine], default: all } }
        - { name: muscle_group, in: query, schema: { $ref: "#/components/schemas/MuscleGroup" } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/ExerciseType" } }
        - { name: equipment, in: query, schema: { $ref: "#/components/schemas/Equipment" } }
        - { name: tracks_weight, in: query, schema: { type: boolean } }
        - { name: tracks_repetitions, in: query, schema: { type: boolean } }
        - { name: tracks_time, in: query, schema: { type: boolean } }
        - { name: tracks_distance, in: query, schema: { type: boolean } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Visible system exercises and the authenticated user's own custom exercises, ordered by normalized name and UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseCollectionEnvelope"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [exercise]
      operationId: createExercise
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseCreate"
      responses:
        "201":
          description: Custom exercise created.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ExerciseETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /exercises/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [exercise]
      operationId: getExercise
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Visible system or owned custom exercise. Archived owned exercises remain directly readable.
          headers:
            ETag: { $ref: "#/components/headers/ExerciseETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [exercise]
      operationId: updateExercise
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExercisePatch"
      responses:
        "200":
          description: Owned custom exercise updated.
          headers:
            ETag: { $ref: "#/components/headers/ExerciseETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseEnvelope"
        "403":
          description: System exercises are immutable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [exercise]
      operationId: archiveExercise
      description: Archives an owned custom exercise. Referencing program/workout history is retained.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Exercise archived.
        "403":
          description: System exercises are immutable.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /programs:
    get:
      tags: [program]
      operationId: listPrograms
      security:
        - bearerAuth: []
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ProgramStatus" } }
        - { name: include_archived, in: query, schema: { type: boolean, default: false } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Owned program summaries ordered by last update and UUID descending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramCollectionEnvelope"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    post:
      tags: [program]
      operationId: createProgram
      description: Creates a draft program and its optional ordered tree transactionally.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramCreate"
      responses:
        "201":
          description: Draft program created.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /programs/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      tags: [program]
      operationId: getProgram
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Full owned program aggregate, including ordered days and exercises.
          headers:
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      tags: [program]
      operationId: updateProgram
      description: Strict partial root update. If days is present, it atomically replaces the active ordered tree and archives the previous tree.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramPatch"
      responses:
        "200":
          description: Program aggregate updated; root version incremented once.
          headers:
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [program]
      operationId: archiveProgram
      description: Archives the program root without deleting its current or previous tree rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: Program archived.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
  /programs/{id}/duplicate:
    post:
      tags: [program]
      operationId: duplicateProgram
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramDuplicate"
      responses:
        "201":
          description: Independent draft copy created with fresh program/day/item UUIDs.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /programs/{id}/activate:
    post:
      tags: [program]
      operationId: activateProgram
      description: Atomically deactivates any currently active owned program and activates this one. The request body must be empty.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Target program activated. At most one program remains active.
          headers:
            ETag: { $ref: "#/components/headers/ProgramETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramEnvelope"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: gymtracker_refresh
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      example: '"profile:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1024 }
  headers:
    ProfileETag:
      schema: { type: string }
      example: '"profile:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    ExerciseETag:
      schema: { type: string }
      example: '"exercise:018f4ea8-89af-47d7-b7e3-43d94f83292e:3"'
    ProgramETag:
      schema: { type: string }
      example: '"program:018f4ea8-89af-47d7-b7e3-43d94f83292e:7"'
  responses:
    Problem:
      description: Problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
    AuthData:
      type: object
      additionalProperties: false
      required: [user_id, email, access_token, access_expires_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuthData"
        meta:
          $ref: "#/components/schemas/Meta"
    Profile:
      type: object
      additionalProperties: false
      required:
        - user_id
        - name
        - sex
        - birth_date
        - height_cm
        - goal
        - experience_level
        - training_frequency
        - timezone
        - unit_system
        - sleep_hours_average
        - notes
        - version
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          type: [number, "null"]
          minimum: 50
          maximum: 300
        goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
        experience_level:
          oneOf:
            - $ref: "#/components/schemas/ExperienceLevel"
            - type: "null"
        training_frequency:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        timezone:
          type: string
          minLength: 1
          maxLength: 255
          example: Europe/Moscow
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
        sleep_hours_average:
          type: [number, "null"]
          minimum: 0
          maximum: 24
        notes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 100
        sex:
          oneOf:
            - $ref: "#/components/schemas/Sex"
            - type: "null"
        birth_date:
          type: [string, "null"]
          format: date
        height_cm:
          type: [number, "null"]
          minimum: 50
          maximum: 300
        goal:
          oneOf:
            - $ref: "#/components/schemas/Goal"
            - type: "null"
        experience_level:
          oneOf:
            - $ref: "#/components/schemas/ExperienceLevel"
            - type: "null"
        training_frequency:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        timezone:
          type: string
          minLength: 1
          maxLength: 255
        unit_system:
          $ref: "#/components/schemas/UnitSystem"
    ProfileImport:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sex:
          $ref: "#/components/schemas/Sex"
        height_cm:
          type: number
          minimum: 50
          maximum: 300
        weight_kg:
          type: number
          minimum: 20
          maximum: 700
        goal:
          $ref: "#/components/schemas/Goal"
        training_frequency:
          type: integer
          minimum: 1
          maximum: 7
        experience_level:
          $ref: "#/components/schemas/ExperienceLevel"
        sleep_hours_average:
          type: number
          minimum: 0
          maximum: 24
        measurements:
          $ref: "#/components/schemas/ImportedMeasurements"
        notes:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
    ImportedMeasurements:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        chest_cm: { type: number, minimum: 5, maximum: 400 }
        waist_cm: { type: number, minimum: 5, maximum: 400 }
        hips_cm: { type: number, minimum: 5, maximum: 400 }
        neck_cm: { type: number, minimum: 5, maximum: 200 }
        biceps_cm: { type: number, minimum: 5, maximum: 200 }
    ImportData:
      type: object
      additionalProperties: false
      required: [profile, initial_measurement_id]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
        initial_measurement_id:
          type: [string, "null"]
          format: uuid
    ProfileEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/Profile"
        meta:
          $ref: "#/components/schemas/Meta"
    ImportEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/ImportData"
        meta:
          $ref: "#/components/schemas/Meta"
    Exercise:
      type: object
      additionalProperties: false
      required:
        - id
        - owner_user_id
        - name
        - description
        - instructions
        - primary_muscle_group
        - exercise_type
        - equipment
        - movement_pattern
        - is_unilateral
        - tracks_weight
        - tracks_repetitions
        - tracks_time
        - tracks_distance
        - version
        - archived_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: [string, "null"], format: uuid, description: Null identifies a system exercise. }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        instructions: { type: [string, "null"], minLength: 1, maxLength: 8000 }
        primary_muscle_group:
          oneOf:
            - $ref: "#/components/schemas/MuscleGroup"
            - type: "null"
        exercise_type: { $ref: "#/components/schemas/ExerciseType" }
        equipment:
          oneOf:
            - $ref: "#/components/schemas/Equipment"
            - type: "null"
        movement_pattern: { type: [string, "null"], minLength: 1, maxLength: 100 }
        is_unilateral: { type: boolean }
        tracks_weight: { type: boolean }
        tracks_repetitions: { type: boolean }
        tracks_time: { type: boolean }
        tracks_distance: { type: boolean }
        version: { type: integer, minimum: 1 }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExerciseCreate:
      type: object
      additionalProperties: false
      required: [name, exercise_type, equipment]
      anyOf:
